        .layout-grid { display: flex;

            .layout-grid > div {

                max-width: 500px;
            }
        @media (min-width: 768px) { .layout-grid { grid-template-columns: 2fr 1fr; } }

    <script src="../../js/introducirCarta.js" defer></script>

        <div class="contenido-header flex-between">
            <div class="flex items-center gap-4">

            <button id="bAjustes" class="btn-icon"><span class="material-symbols-outlined">settings</span></button>

                <h2 class="text-4xl mt-2 mb-4">Mantén tu carta actualizada</h2>
                <p class="text-variant text-lg">Sincroniza tu inventario y platos con un simple archivo.</p>
            </div>
            <div style="flex: 1; position: relative; border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-editorial);">
                <img src="../../src/imagenes/cocina.jpg" alt="Kitchen" style="width: 100%; height: 300px; object-fit: cover;"/>
            </div>
        </section>

        <section class="layout-grid card flex-col md:flex-row flex-between mb-8">

                    <span class="material-symbols-outlined text-4xl">inventory_2</span>
                </div>
                <div>
                    <h3 class="text-2xl mb-1">Introduce el archivo .xlsx</h3>
                    <p class="text-variant text-sm">(de las comidas del restaurante)</p>

            <div class="flex-col gap-6">
                <div class="card" style="background: var(--surface-high);">
                    <div class="flex-between mb-8">
                        <h4 class="text-xl">Ajustes</h4>
                        <span class="material-symbols-outlined text-primary">tune</span>
                    </div>
                    <ul class="flex-col gap-2">
                        <li class="card flex-between card-hover" style="padding: 1rem; cursor: pointer; border-radius: var(--radius-full);">
                            <div class="flex items-center gap-3"><span class="material-symbols-outlined" style="color: var(--primary-container);">notifications</span> <span class="text-sm font-bold">Alertas de Stock</span></div>
                            <span class="material-symbols-outlined text-variant text-sm">chevron_right</span>
                        </li>
                        <li class="card flex-between card-hover" style="padding: 1rem; cursor: pointer; border-radius: var(--radius-full);">
                            <div class="flex items-center gap-3"><span class="material-symbols-outlined" style="color: var(--primary-container);">schedule</span> <span class="text-sm font-bold">Horarios</span></div>
                            <span class="material-symbols-outlined text-variant text-sm">chevron_right</span>
                        </li>
