<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RestaurantApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../../stylesCSS/styles.css"/>
    <script src="../../js/main.js" defer></script>
    <link rel="icon" href="../../src/imagenes/favicon2.png" type="image/x-icon">
</head>
<body>
    <header class="app-header">
        <div class="contenido-header flex-between">
            <div class="flex items-center gap-4">
                <button id="bVolver" class="btn-icon"><span class="material-symbols-outlined">arrow_back</span></button>
                <h1 class="text-xl">Mesa 14</h1>
            </div>
            <div class="flex items-center gap-2">
                
                <button class="btn-icon"><span class="material-symbols-outlined">account_circle</span></button>
            </div>
        </div>
    </header>

    <main class="container-sm">
        <div class="flex-between mb-8" style="align-items: flex-end;">
            <div>
                
                <h2 class="text-4xl text-primary">Pedido actual</h2>
            </div>
            
        </div>

        <div class="flex-col gap-4 mb-12">
            <div class="card flex-between card-hover" style="background: var(--surface-container); padding: 1.25rem;">
                <div class="flex items-center gap-4">
                    <img src="../../src/imagenes/pasta.jpg" alt="Pasta" style="width: 4rem; height: 4rem; border-radius: var(--radius-md); object-fit: cover;"/>
                    <div>
                        <h3 class="font-bold">Truffle Tagliatelle</h3>
                        <p class="text-sm text-variant">Boletus con queso parmesano italiano</p>
                    </div>
                </div>
                <div style="text-align: right;">
                    <p class="font-bold">2 × 28.00€</p>
                    <p class="font-bold text-primary">56.00€</p>
                </div>
            </div>
            <div class="card flex-between card-hover" style="background: var(--surface-container); padding: 1.25rem;">
                <div class="flex items-center gap-4">
                    <img src="../../src/imagenes/sbagliato.jpg" alt="Cóctel" style="width: 4rem; height: 4rem; border-radius: var(--radius-md); object-fit: cover;"/>
                    <div>
                        <h3 class="font-bold">Negroni Sbagliato</h3>
                        <p class="text-sm text-variant">Dulce, burbujeante y amargo</p>
                    </div>
                </div>
                <div style="text-align: right;">
                    <p class="font-bold">3 × 14.00€</p>
                    <p class="font-bold text-primary">42.00€</p>
                </div>
            </div>
        </div>

        <div class="card mb-8" style="background: var(--surface-low); border: 1px solid var(--outline-variant); padding: 2rem;">
            <div class="flex-between mb-4">
                <span class="text-variant">Subtotal</span><span class="font-bold">98.00€</span>
            </div>
            <div class="flex-between mb-6">
                <span class="text-variant">Servicio (10%)</span><span class="font-bold">9.80€</span>
            </div>
            <div class="flex-between" style="border-top: 1px solid var(--outline-variant); padding-top: 1.5rem; align-items: flex-end;">
                <div>
                    <span class="text-xs uppercase text-variant font-bold tracking-widest block mb-1">Total</span>
                    <span class="text-5xl font-extrabold">107.80€</span>
                </div>
                <span class="material-symbols-outlined" style="font-size: 2.5rem; color: var(--primary-container);">payments</span>
            </div>
        </div>

        <button id="bImprimirCuenta" class="btn btn-primary btn-block text-xl">
            <span class="material-symbols-outlined">print</span> Imprimir cuenta
        </button>
        <br><br>
        <button class="btn btn-primary btn-block text-xl">
            <span class="material-symbols-outlined">kitchen</span> Enviar pedido a cocina
        </button>

        <p class="text-center text-sm text-variant mt-4">La confirmación se enviará a la cocina.</p>

        <nav class="bottom-nav">
            <button class="btn btn-primary btn-block" style="border-radius: var(--radius-full);">
                <span class="material-symbols-outlined">check_circle</span> CONFIRMAR PEDIDO
            </button>
        </nav>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item"><span class="material-symbols-outlined">grid_view</span><span class="text-xs mt-2">Salón</span></button>
        <button class="nav-item active-bg"><span class="material-symbols-outlined icon-filled">receipt_long</span><span class="text-xs mt-2">Pedidos</span></button>
        <button class="nav-item"><span class="material-symbols-outlined">event_seat</span><span class="text-xs mt-2">Reservas</span></button>
        <button class="nav-item"><span class="material-symbols-outlined">settings</span><span class="text-xs mt-2">Ajustes</span></button>
    </nav>
</body>
</html>
