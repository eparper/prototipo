<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Menú - Realiza tu pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="../../stylesCSS/styles.css"/>
    <script src="../../js/cartaMenus.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="contenido-header">
            <div class="flex-center gap-4">
                <button id="bAtras" class="btn-icon"><span class="material-symbols-outlined">arrow_back</span></button>
                <h1 class="text-2xl">RestaurantApp</h1>
            </div>
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCrSYonVf5WjjakHXBqsyfQeRDDsC7ToNbxExlXQtbBFDPESjuFj8n0WTJ_1CWjNvh8v1t5AsDLdU1EGPj2Gp-VbHHz3V650A2RKnyd7pQDJBBKmRdPMGhabkI9L0mVNocxWubencnQX4BrgKWEORjj-f2KQ9ZNy6qsIRl84sIxPMpzFK-P1VOShfHxk5FrGDbPP0uwcek3PslHnO6gRBJ_koSrdOnYyE795w8ResA43Ax3hY_COK0jHfYsX3vEqsSxBqzgdDq_6-8" alt="Perfil" class="avatar"/>
        </div>
    </header>

    <main class="container">
        <section class="mb-8">
            <h2 class="text-4xl mb-2">Realiza tu pedido</h2>
            <p class="text-variant text-lg">Sabores artesanales entregados directamente a tu mesa.</p>
        </section>

        <section class="grid-4 mb-8">
            <button class="card flex-col flex-center card-hover text-primary" style="background: var(--primary-container); color: var(--on-primary-container);">
                <span class="material-symbols-outlined text-3xl mb-2">today</span>
                <span class="font-bold">Del día</span>
            </button>
            <button class="card flex-col flex-center card-hover" style="background: var(--surface-container);">
                <span class="material-symbols-outlined text-3xl mb-2 text-variant">restaurant_menu</span>
                <span class="font-bold text-variant">Menús</span>
            </button>
            <button class="card flex-col flex-center card-hover" style="background: var(--surface-container);">
                <span class="material-symbols-outlined text-3xl mb-2 text-variant">local_bar</span>
                <span class="font-bold text-variant">Bebidas</span>
            </button>
            <button class="card flex-col flex-center card-hover" style="background: var(--surface-container);">
                <span class="material-symbols-outlined text-3xl mb-2 text-variant">icecream</span>
                <span class="font-bold text-variant">Postres</span>
            </button>
        </section>

        <section>
            <div class="flex-between mb-6">
                <h3 class="text-2xl">Platos Recomendados</h3>
                
            </div>

            <div class="grid-2">

                <article class="card card-hover" style="padding: 0.5rem;">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuC0xNFvO9cU3bqm5Iw4Cy7hKkX7X0JzZaBOndjj1j2QLTrj5kUFVshlC3h6sag9i1abollNWPbjFQy6Vp2AwprlklCJ0_7ESAs4SuAi3mPXCKG75qWldCH_7u5qt6jaFEpyKIrn3rRr4BVjcQsE2MdmEn6TTOfXoNlUT1qhwkeyw5qtpflKu53oEiQg8FHap4YKbfmp9J1Qofu3MrdNlwkURkWXWEYS6nCAQ1yjQgMsNM6oKNcClEa1qwNEDodlYeKr9YUahvq_-KQ" alt="Ensalada" class="card-image mb-4"/>
                    <div style="padding: 0.5rem 1rem 1rem;">
                        <h4 class="text-xl mb-2">Ensalada César Gourmet</h4>
                        <p class="text-sm text-variant mb-4">Corazones de lechuga orgánica y salsa secreta.</p>
                        <div class="flex-between">
                            <span class="text-lg font-bold">18.00€</span>
                            <button class="btn-icon" style="background: var(--surface-high);"><span class="material-symbols-outlined">add</span></button>
                        </div>
                    </div>
                </article>
                <article class="card card-hover" style="padding: 0.5rem;">
                    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwVNB3rgoqNg_OWndfC9uqPHk5R-TC1iJtNJXYClmlE7zLd6hoNlGtEjjc0qhEv6vGknnx9-bmBmwDoaSD8j4W5nWgQVIAdVgafvh45Tc_qwhmy-0vAHe70eaGNJ_BtDqKW-DSmKBXUbgURtdUL012TcRzgPvntAKghaBzBt-Vf5sb681-e7Su_hsCxQq7OG58gqRwE2ApuJFJvZIM-rTaUDht3SqQAEEb8r0qc5iN6cXLingwIls_GIxNCy89VohGOKYbhYOHSnk" alt="Spritz" class="card-image mb-4"/>
                    <div style="padding: 0.5rem 1rem 1rem;">
                        <h4 class="text-xl mb-2">Spritz del Bosque</h4>
                        <p class="text-sm text-variant mb-4">Refrescante combinación de frutos rojos y cava.</p>
                        <div class="flex-between">
                            <span class="text-lg font-bold">11.00€</span>
                            <button class="btn-icon" style="background: var(--surface-high);"><span class="material-symbols-outlined">add</span></button>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <div style="position: fixed; bottom: 0; left: 0; width: 100%; padding: 1.5rem; background: rgba(255,255,255,0.9); backdrop-filter: blur(16px); border-top: 1px solid var(--outline-variant); z-index: 60;">
        <div class="container" style="padding: 0; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <span class="text-xs uppercase text-variant font-bold block">Total a pagar</span>
                <span class="text-3xl font-extrabold">32.70€</span>
            </div>
            <button id="bPedir" class="btn btn-primary" style="padding: 1rem 3rem; font-size: 1.25rem;">
                <span class="material-symbols-outlined">shopping_bag</span> Pedir
            </button>
        </div>
    </div>
</body>
</html>
